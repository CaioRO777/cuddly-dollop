<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Palavra Secreta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Jogo da Palavra Secreta</h1>

    <div class="container">
        <p>Tente adivinhar a palavra (6 tentativas)</p>

        <input type="text" id="inputPalpite" placeholder="Digite sua tentativa">
        <button id="btnTentar">Tentar</button>

        <p id="resultado"></p>
        <p id="tentativasRestantes"></p>

        <button id="btnReiniciar">Reiniciar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
